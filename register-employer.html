<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobFinder — Регистрация</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <a href="#" class="title">Job<span>Finder</span></a>
            </div>

            <button class="header__burger_menu" id="burger-toggle" aria-label="Открыть меню">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="header__menu" id="nav-menu">
                <ul class="header__menu-list">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="vacancies.html">Вакансии</a></li>
                    <li><a href="resumes.html">Резюме</a></li>
                    <li><a href="#">Для соискателей</a></li>
                    <li><a href="#">Для работодателей</a></li>
                </ul>
                
                <div class="header__actions">
                    <button id="theme-toggle" class="header__theme-changer" title="Сменить тему">🌓</button>
                </div>
            </nav>
        </div>
    </header>

    <div class="content">
        <main class="auth-page">
            <div class="auth-card register-card">
                <div class="auth-header">
                    <a href="register-type.html" class="back-link">← Назад к выбору</a>
                    <h1>Регистрация компании</h1>
                    <p>Находите лучших специалистов для ваших задач</p>
                </div>

                <form class="register-form">
                    <div class="form-section">
                        <div class="form-group">
                            <label>Название организации</label>
                            <input type="text" placeholder="ООО «ТМЫВ ДЕНЕГ»" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Отрасль</label>
                                <select class="form-select">
                                    <option value="it">IT и разработка</option>
                                    <option value="design">Дизайн и маркетинг</option>
                                    <option value="sales">Продажи</option>
                                    <option value="education">Образование</option>
                                    <option value="finance">Финансы</option>
                                    <option value="medicine">Медицина</option>
                                    <option value="other">Другое</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Размер компании</label>
                                <select class="form-select">
                                    <option value="1-10">1-10 человек</option>
                                    <option value="11-50">11-50 человек</option>
                                    <option value="50+">Более 50</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="form-group">
                            <label>Рабочая почта</label>
                            <input type="email" placeholder="hr@company.ru" required>
                        </div>
                        <div class="form-group">
                            <label>Пароль</label>
                            <input type="password" placeholder="Придумайте пароль" required>
                        </div>
                    </div>

                    <div class="form-checkbox">
                        <input type="checkbox" id="employer-terms" required>
                        <label for="employer-terms">Я подтверждаю, что представляю интересы указанной компании</label>
                    </div>

                    <button type="submit" class="btn-submit">Зарегистрировать компанию</button>
                </form>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
