<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobFinder — Поиск работы и сотрудников</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <a href="#" class="title">Job<span>Finder</span></a>
            </div>

            <button class="header__burger_menu" id="burger-toggle" aria-label="Открыть меню">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="header__menu" id="nav-menu">
                <ul class="header__menu-list">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="#">Вакансии</a></li>
                    <li><a href="#">Резюме</a></li>
                    <li><a href="#">Для соискателей</a></li>
                    <li><a href="#">Для работодателей</a></li>
                </ul>
                
                <div class="header__actions">
                    <button id="theme-toggle" class="header__theme-changer" title="Сменить тему">🌓</button>
                </div>
            </nav>
        </div>
    </header>
    
    <main class="auth-page">
        <div class="auth-card register-card">
            <div class="auth-header">
                <a href="register-type.html" class="back-link">← Назад к выбору</a>
                <h1>Создание профиля</h1>
                <p>Расскажите о себе, чтобы работодатели могли вас найти</p>
            </div>

            <form class="register-form">
                <div class="form-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Имя</label>
                            <input type="text" placeholder="Иван" required>
                        </div>
                        <div class="form-group">
                            <label>Фамилия</label>
                            <input type="text" placeholder="Иванов" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Желаемая должность</label>
                        <input type="text" placeholder="Например: Frontend-разработчик">
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-group">
                        <label>Электронная почта</label>
                        <input type="email" placeholder="example@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" placeholder="Придумайте надежный пароль" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>О себе (коротко)</label>
                    <textarea placeholder="Ваши ключевые навыки и достижения..." rows="4"></textarea>
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">Я согласен с условиями использования и политикой конфиденциальности</label>
                </div>

                <button type="submit" class="btn-submit">Создать резюме</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
