<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobFinder — Поиск работы и сотрудников</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <a href="#" class="title">Job<span>Finder</span></a>
            </div>

            <button class="header__burger_menu" id="burger-toggle" aria-label="Открыть меню">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="header__menu" id="nav-menu">
                <ul class="header__menu-list">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="#">Вакансии</a></li>
                    <li><a href="#">Резюме</a></li>
                    <li><a href="#">Для соискателей</a></li>
                    <li><a href="#">Для работодателей</a></li>
                </ul>
                
                <div class="header__actions">
                    <button id="theme-toggle" class="header__theme-changer" title="Сменить тему">🌓</button>
                </div>
            </nav>
        </div>
    </header>
    <div class="content">
        <main class="login-page">
            <div class="login-container">
                <div class="login-card">
                    <div class="login-header">
                        <h1>С возвращением!</h1>
                        <p>Войдите в свой аккаунт, чтобы продолжить</p>
                    </div>

                    <form class="login-form">
                            <div class="form-group">
                                <label for="email">Электронная почта</label>
                                <input type="email" id="email" placeholder="example@mail.com" required>
                            </div>

                            <div class="form-group">
                                <div class="label-row">
                                    <label for="password">Пароль</label>
                                    <a href="#" class="forgot-pass">Забыли пароль?</a>
                                </div>
                                <input type="password" id="password" placeholder="••••••••" required>
                            </div>

                            <button type="button" class="login-submit" onclick="handleLoginClick()">Войти</button>
                            <div class="after-submitting">
                                <div class="after-submitting-row">
                                    <a href="profile-employer.html">Я работодатель</a>
                                    <a href="profile-candidate.html">Я соискатель</a>
                                </div>
                            </div>
                            <div class="login-divider">
                                <span>или</span>
                            </div>

                            <div class="login-socials">
                                <button type="button" class="social-btn">
                                    <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" alt="Google" width="18">
                                    Google
                                </button>
                                <button type="button" class="social-btn">
                                    <svg width="18" height="18" viewBox="0 0 384 512" fill="currentColor">
                                        <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
                                    </svg>
                                    Apple
                                </button>
                            </div>

                        
                    </form>

                    <p class="login-footer">
                        Впервые у нас? <a href="register-type.html">Создать аккаунт</a>
                    </p>
                </div>
            </div>
        </main>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
